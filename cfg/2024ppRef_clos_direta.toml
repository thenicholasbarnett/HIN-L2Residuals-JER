# Closure pass for 2024 ppRef using the independent full-eta ("direct eta")
# L2Residual fits — no |eta| mirroring assumption. Copied from
# cfg/2024ppRef.toml; only [jec] residual_files differs.

[paths]
veto_map = "data/veto/Winter25Prompt25_RunCDE.root"
golden_json = "data/json/Cert_Collisions2024_ppref_387474_387721_golden.json"

[trees]
hi = "hiEvtAnalyzer/HiTree"
skim = "skimanalysis/HltTree"
trigger = "hltanalysis/HltTree"
filter = "pprimaryVertexFilter"
jets = [
    "ak2PFJetAnalyzer/t",
    "ak3PFJetAnalyzer/t",
    "ak4PFJetAnalyzer/t",
    "ak5PFJetAnalyzer/t",
    "ak6PFJetAnalyzer/t",
]

[trigger]
branch = "HLT_AK4PFJet80_v8"
threshold = 100.0
cone = "ak4PF"

[jet_id]
veto_map_histogram = "jetvetomap_all"

[cones]
labels = [ "ak2PF", "ak3PF", "ak4PF", "ak5PF", "ak6PF" ]

[jec]
files = [
    [ "data/jec/Prompt24HIpp_V1_MC_L2Relative_AK2PF.txt" ],
    [ "data/jec/Prompt24HIpp_V1_MC_L2Relative_AK3PF.txt" ],
    [ "data/jec/Prompt24HIpp_V1_MC_L2Relative_AK4PF.txt" ],
    [ "data/jec/Prompt24HIpp_V1_MC_L2Relative_AK5PF.txt" ],
    [ "data/jec/Prompt24HIpp_V1_MC_L2Relative_AK6PF.txt" ],
]
# Direct full-eta (no mirroring) L2Residual fits from Step 3 — applied only
# when runAsymmetry's mode != MC.
residual_files = [
    [ "data/jec/internal/txt_ak2PF_eta_norm.txt" ],
    [ "data/jec/internal/txt_ak3PF_eta_norm.txt" ],
    [ "data/jec/internal/txt_ak4PF_eta_norm.txt" ],
    [ "data/jec/internal/txt_ak5PF_eta_norm.txt" ],
    [ "data/jec/internal/txt_ak6PF_eta_norm.txt" ],
]

[cuts]
min_jet_pt = 10.0
dphi = 2.7
max_abs_a = 0.7
min_entries_per_bin = 100

[binning]
# pT_avg slice edges (GeV) used by Step 2/3 and plotResiduals — must be
# strictly ascending. Step 3 assigns each slice entirely to HP or ZB based on
# whether slice.lo is at/above [trigger].threshold, so keep an edge exactly at
# the threshold (or only add edges strictly above/below it) — a slice that
# straddles the threshold gets assigned to ZB in full, since any part of it
# below the threshold could be trigger-biased in HP.
ptavg_edges = [ 30, 70, 100, 175, 250, 500, 1000 ]
