# Template for a new collision system / dataset.
#
# This is a scaffold, not a runnable config: copy it to a new file
# (e.g. cfg/2025OO.toml) and fill in every REQUIRED_* placeholder before
# pointing L2RESIDUALS_CONFIG at it. 

[paths]
# Jet ID, veto map, and golden JSON are per-run-period. No default exists.
# Jet ID + veto map: JME correctionlib JSON (unzipped), read by JetSelector.h
jet_id = "REQUIRED_SET_ME/path/to/jetid.json"
veto_map = "REQUIRED_SET_ME/path/to/jetvetomaps_<tag>.json"
golden_json = "REQUIRED_SET_ME/path/to/golden.json"

[condor]
# Maps each data/txt/*.txt filelist (basename, no extension) to a run mode:
# triggered | non-triggered | mc. make_condor.sh looks up each filelist it
# would submit here; comment out (or omit) an entry to skip submitting jobs
# for that filelist without moving or renaming the file. The physical dataset
# name is free-form (e.g. a triggered jet dataset, a MinBias/ZeroBias
# non-triggered dataset); only the mapped mode matters.
[condor.filelist_modes]
# REQUIRED_SET_ME_filelist_basename = "triggered"
# REQUIRED_SET_ME_filelist_basename = "non-triggered"
# REQUIRED_SET_ME_filelist_basename = "mc"

[trees]
hi = "hiEvtAnalyzer/HiTree"
gg = "ggHiNtuplizer/EventTree"
skim = "skimanalysis/HltTree"
trigger = "hltanalysis/HltTree"
filter = "pprimaryVertexFilter"
jets = [
    "ak2PFJetAnalyzer/t",
    "ak3PFJetAnalyzer/t",
    "ak4PFJetAnalyzer/t",
    "ak5PFJetAnalyzer/t",
    "ak6PFJetAnalyzer/t",
]

[trigger]
branch = "REQUIRED_SET_ME"
threshold = 0.0
cone = "REQUIRED_SET_ME"

[jet_id]
# system: "pp" (full AK4CHS TightLeptonVeto) | "ion" (leptonic/EM cuts only)
# purpose: "analysis" (jetvetomap) | "calibration" (jetvetomap_all, strictest)
system = "REQUIRED_SET_ME"
purpose = "calibration"
# JME Run 3 event veto (runAsymmetry): drop the event if any jet of this
# cone has pT > 15 GeV, tight ID, EMF < 0.9 and sits in the veto map; the
# maps are derived with AK4 jets. "" = off (per-jet ID + veto only)
event_veto_cone = "ak4PF"

[cones]
labels = [ "ak2PF", "ak3PF", "ak4PF", "ak5PF", "ak6PF" ]

[jec]
# Each inner list is a per-cone correction chain, applied in order (e.g.
# L1FastJet then L2Relative) -- a single-entry list applies just that one
# level.
files = [
    [ "REQUIRED_SET_ME/AK2PF.txt" ],
    [ "REQUIRED_SET_ME/AK3PF.txt" ],
    [ "REQUIRED_SET_ME/AK4PF.txt" ],
    [ "REQUIRED_SET_ME/AK5PF.txt" ],
    [ "REQUIRED_SET_ME/AK6PF.txt" ],
]

[jer_closure]
# Only read when runAsymmetry is run with -calibration jer -closure true:
# MC jets get JER-smeared (JetSmearer.h, method below) before histogramming,
# to produce the smeared MC input for the JER SF closure check. One text
# file per cone, same order as cones.labels above -- unset/empty means no
# JER closure smearing has been derived for this run period yet.
# smearing method (JetSmearer.h): "hybrid" (JME recommendation, default),
# "scaling" (gen-matched jets only) or "stochastic" (Gaussian, every jet)
method = "hybrid"
resolution_files = [
]
scale_factor_files = [
]

[cuts]
min_jet_pt = 10.0
dphi = 2.7
max_abs_a = 0.7
min_entries_per_bin = 100
residual_gaus_fit_half_width = 0.5
residual_alpha_fit_hi = 0.31
# Gaussian fit window: [1-x, 1+x] around the pT_reco/pT_gen response,
# analogous to residual_gaus_fit_half_width above (centered at 0, not 1).
# Used both by runPlotting's response_dist QA guide curve and, since the
# Gauss/doubleGauss/crystalball extraction methods, as the initial
# peak-locate window in runResponse's JES/JER extraction (ResponseExtractor.cxx)
# -- the trunc90/trunc95 methods don't use this, they read the fraction of
# the integral directly (hardcoded, matching Step 2's own trunc90/trunc95).
response_gaus_fit_half_width = 0.3

[binning]
ptavg_edges = [ 30, 70, 100, 175, 250, 500, 1000 ]

[step3]
default_method = "gauss"
# other options currently available: doubleGauss | trunc90 | trunc95
eta_mode = "both"
# other options currently available: abseta | eta
# pT-fit x values: "mean" (weighted <pT_avg> per slice, from Step 2) | "midpoint"
pt_center = "mean"
